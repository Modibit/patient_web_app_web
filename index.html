<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="اپلیکیشن رزرو نوبت کلینیک">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sepamed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>سپامد</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading_indicator {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      text-align: center;
    }

    #loading_indicator .logo {
      max-width: 100px;
      margin-bottom: 30px;
    }

    #loading_indicator .loader {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #bc004b;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading_indicator p {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #progress-container {
      width: 200px;
      height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #bc004b;
      transition: width 0.2s;
    }

    #progress-text {
      margin-top: 5px;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="loading_indicator">
    <img src="icons/Icon-192.png" alt="سپامد | Sepamed" class="logo">
    <div class="loader"></div>
    <p>در حال بارگذاری ...</p>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">0%</div>
  </div>

  <script>
    const assetsToLoad = [
      "main.dart.js",
      "flutter.js",
      "canvaskit/canvaskit.js",
      "canvaskit/canvaskit.wasm",
      "assets/AssetManifest.json",
      "assets/FontManifest.json",
      "assets/fonts/MaterialIcons-Regular.otf",
      "assets/packages/iconsax/lib/assets/fonts/iconsax.ttf",
      "assets/packages/iconsax_flutter/fonts/FlutterIconsax.ttf",
      "assets/assets/images/logo.png"
    ];

    let totalSize = 0;
    let loadedSize = 0;

    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    const updateProgress = () => {
      const percent = Math.floor((loadedSize / totalSize) * 100);
      progressBar.style.width = percent + "%";
      progressText.textContent = percent + "%";
    };

    const loadWithProgress = (url) => {
      return fetch(url)
        .then((response) => {
          const contentLength = response.headers.get("content-length");
          if (!contentLength) return response.blob(); // fallback

          const total = parseInt(contentLength, 10);
          totalSize += total;

          const reader = response.body.getReader();
          let received = 0;

          return new ReadableStream({
            start(controller) {
              function push() {
                reader.read().then(({ done, value }) => {
                  if (done) {
                    controller.close();
                    return;
                  }
                  received += value.length;
                  loadedSize += value.length;
                  updateProgress();
                  controller.enqueue(value);
                  push();
                });
              }
              push();
            },
          });
        })
        .then((stream) => new Response(stream))
        .then((res) => res.blob());
    };

    const preloadAssets = async () => {
      for (let url of assetsToLoad) {
        try {
          await loadWithProgress(url);
        } catch (e) {
          console.error("خطا در بارگذاری", url, e);
        }
      }

      const script = document.createElement("script");
      script.src = "flutter_bootstrap.js";
      script.async = true;
      document.body.appendChild(script);
    };

    preloadAssets();
  </script>
</body>
</html>
